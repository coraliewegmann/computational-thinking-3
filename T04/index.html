<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartenansicht</title>
</head>
<body>
    <h1>Kartenansicht</h1>
    <label>
        Breite
        <input type="range" id="breite" min="200" max="1400" value="720">
    </label>
        <label>
        Zoom
        <input type="range" id="zoom" min="1" max="20" step="0.1" value="1">
    </label>
    <div id="karte"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
